en:{skip_link:"Skip to main content",kicker:"HELP",title:"Help & FAQ",subtitle:"Answers about scanning labels, Choices, Evidence, barcode, nutrition, privacy and access.",intro_title:"Start with the label",intro_body:"BOTIA begins with what the package actually declares. The ingredient list is the primary source for ingredient analysis. Barcode / GTIN and external sources can add product traceability, but they do not replace the label.",faq_title:"Frequently asked questions",q1:"What is BOTIA?",a1:"BOTIA is food-label intelligence. It reads the ingredient list printed on a product and organises what it finds into ingredient explanations, Evidence layers, regulatory context and personal Choices. It gives context, not a single score or moral verdict.",q2:"How do I scan a product?",a2:"Photograph the ingredient list so the full text is visible and readable. You can also capture the nutrition panel and a barcode / GTIN when you want those parts of the same product session.",q3:"Does BOTIA use the barcode to analyse ingredients?",a3:"No. Ingredient analysis starts from the real ingredient list on the package. Barcode / GTIN is used for product identification and traceability. It can add context, but it does not replace the label.",q4:"What is the difference between Choices and Evidence?",a4:"Choices are persistent personal views such as Animal, Woman and Muslim. Evidence layers appear when the analysis finds relevant signals, for example Sugar, Sweeteners, Flavours, Texture or E-numbers. BOTIA keeps these two things separate.",q5:"Does Muslim Choice mean halal certification?",a5:"No. BOTIA is not a halal certification body. It can show Halal, Haram or Doubt / Mushbooh according to what the ingredient list and available evidence support. When origin or process cannot be established, the uncertainty stays visible instead of being guessed.",q6:"How does Nutritional Facts work?",a6:"Nutrition is analysed separately from ingredients. BOTIA starts from the values declared on the nutrition panel. A missing, unreadable or invalid value is not treated as zero. External reference context is added only when it is valid and is kept separate from what the label itself declares.",q7:"What does “nothing flagged” mean?",a7:"It means BOTIA did not find an active signal for the layers being shown. It does not mean the product is automatically healthy, safe, suitable for everyone or free of every possible concern.",q8:"What happens to my photos and history?",a8:"BOTIA is designed to minimise stored data. Scan photos are not part of the saved history. Local history keeps the minimum information needed to reconstruct a result on your device. For the exact processing used by the current version, see the Privacy Policy.",q9:"Which languages does BOTIA support?",a9:"BOTIA supports English, Spanish, Arabic, German, French, Indonesian, Italian, Dutch, Polish, Portuguese, Romanian, Russian, Turkish and Chinese.",q10:"How do free scans and subscription access work?",a10:"BOTIA includes 5 free scans. After those are used, continued scanning requires the annual subscription. The app shows the current price and billing terms before purchase. Premium use is limited to 300 scans per month.",contact_title:"Still need help?",contact_body:"If a result looks wrong, a label cannot be read or something in the app is not working, contact BOTIA support and describe what happened. Do not send sensitive personal information.",privacy:"Privacy Policy",about:"About BOTIA"},
es:{skip_link:"Saltar al contenido principal",kicker:"AYUDA",title:"Ayuda y preguntas frecuentes",subtitle:"Respuestas sobre el escaneo de etiquetas, Choices, Evidence, código de barras, nutrición, privacidad y acceso.",intro_title:"Empieza por la etiqueta",intro_body:"BOTIA parte de lo que el envase declara realmente. La lista de ingredientes es la fuente principal para analizar ingredientes. El código de barras / GTIN y las fuentes externas pueden añadir trazabilidad del producto, pero no sustituyen la etiqueta.",faq_title:"Preguntas frecuentes",q1:"¿Qué es BOTIA?",a1:"BOTIA es inteligencia de etiquetas alimentarias. Lee la lista de ingredientes impresa en el producto y organiza lo que encuentra en explicaciones de ingredientes, capas de Evidence, contexto regulatorio y Choices personales. Aporta contexto, no una puntuación única ni un juicio moral.",q2:"¿Cómo escaneo un producto?",a2:"Fotografía la lista de ingredientes de forma que se vea y se lea completa. También puedes capturar la tabla nutricional y un código de barras / GTIN cuando quieras incluir esas partes en la misma sesión del producto.",q3:"¿BOTIA usa el código de barras para analizar ingredientes?",a3:"No. El análisis de ingredientes parte de la lista real impresa en el envase. El código de barras / GTIN se utiliza para identificación y trazabilidad del producto. Puede aportar contexto, pero no sustituye la etiqueta.",q4:"¿Cuál es la diferencia entre Choices y Evidence?",a4:"Choices son vistas personales persistentes como Animal, Woman y Muslim. Las capas de Evidence aparecen cuando el análisis encuentra señales relevantes, por ejemplo Sugar, Sweeteners, Flavours, Texture o E-numbers. BOTIA mantiene ambas cosas separadas.",q5:"¿Muslim Choice significa certificación halal?",a5:"No. BOTIA no es un organismo certificador halal. Puede mostrar Halal, Haram o Duda / Mushbooh según lo que sostengan la lista de ingredientes y la evidencia disponible. Cuando no puede establecerse el origen o el proceso, la incertidumbre queda visible en lugar de adivinarse.",q6:"¿Cómo funciona Nutritional Facts?",a6:"La nutrición se analiza por separado de los ingredientes. BOTIA parte de los valores declarados en la tabla nutricional. Un valor ausente, ilegible o no válido no se convierte en cero. El contexto de referencia externo solo se añade cuando es válido y se mantiene separado de lo que declara la propia etiqueta.",q7:"¿Qué significa “nada señalado”?",a7:"Significa que BOTIA no ha encontrado una señal activa para las capas que se están mostrando. No significa que el producto sea automáticamente saludable, seguro, adecuado para todo el mundo o libre de cualquier posible preocupación.",q8:"¿Qué ocurre con mis fotos y el historial?",a8:"BOTIA está diseñado para minimizar los datos almacenados. Las fotos de escaneo no forman parte del historial guardado. El historial local conserva la información mínima necesaria para reconstruir un resultado en tu dispositivo. Para el tratamiento exacto de la versión actual, consulta la Política de privacidad.",q9:"¿Qué idiomas admite BOTIA?",a9:"BOTIA admite inglés, español, árabe, alemán, francés, indonesio, italiano, neerlandés, polaco, portugués, rumano, ruso, turco y chino.",q10:"¿Cómo funcionan los escaneos gratuitos y la suscripción?",a10:"BOTIA incluye 5 escaneos gratuitos. Cuando se consumen, seguir escaneando requiere la suscripción anual. La app muestra el precio y las condiciones de facturación vigentes antes de la compra. El uso premium está limitado a 300 escaneos al mes.",contact_title:"¿Sigues necesitando ayuda?",contact_body:"Si un resultado parece incorrecto, una etiqueta no puede leerse o algo de la app no funciona, contacta con soporte de BOTIA y explica qué ha ocurrido. No envíes información personal sensible.",privacy:"Política de privacidad",about:"Sobre BOTIA"}
};

de:{skip_link:"Zum Hauptinhalt springen",kicker:"HILFE",title:"Hilfe & FAQ",subtitle:"Antworten zu Etikettenscans, Choices, Evidence, Barcode, Nährwerten, Datenschutz und Zugang.",intro_title:"Beginne mit dem Etikett",intro_body:"BOTIA beginnt mit dem, was die Verpackung tatsächlich angibt. Die Zutatenliste ist die Hauptquelle für die Zutatenanalyse. Barcode / GTIN und externe Quellen können Rückverfolgbarkeit ergänzen, ersetzen das Etikett aber nicht.",faq_title:"Häufig gestellte Fragen",q1:"Was ist BOTIA?",a1:"BOTIA ist Food-Label-Intelligence. Es liest die Zutatenliste und ordnet die Ergebnisse in Zutatenerklärungen, Evidence-Ebenen, regulatorischen Kontext und persönliche Choices ein. Es liefert Kontext, keine einzelne Bewertung und kein moralisches Urteil.",q2:"Wie scanne ich ein Produkt?",a2:"Fotografiere die Zutatenliste so, dass der vollständige Text sichtbar und lesbar ist. Du kannst außerdem die Nährwerttabelle und einen Barcode / GTIN erfassen, wenn sie zur gleichen Produktsitzung gehören sollen.",q3:"Verwendet BOTIA den Barcode zur Zutatenanalyse?",a3:"Nein. Die Zutatenanalyse beginnt mit der tatsächlichen Zutatenliste auf der Verpackung. Barcode / GTIN dient der Produktidentifikation und Rückverfolgbarkeit. Er kann Kontext hinzufügen, ersetzt das Etikett aber nicht.",q4:"Was ist der Unterschied zwischen Choices und Evidence?",a4:"Choices sind dauerhafte persönliche Ansichten wie Animal, Woman und Muslim. Evidence-Ebenen erscheinen, wenn die Analyse relevante Signale findet, zum Beispiel Sugar, Sweeteners, Flavours, Texture oder E-numbers. BOTIA hält beides getrennt.",q5:"Bedeutet Muslim Choice eine Halal-Zertifizierung?",a5:"Nein. BOTIA ist keine Halal-Zertifizierungsstelle. Es kann Halal, Haram oder Doubt / Mushbooh anzeigen, soweit Zutatenliste und verfügbare Evidenz dies stützen. Wenn Herkunft oder Verfahren nicht feststellbar sind, bleibt die Unsicherheit sichtbar.",q6:"Wie funktioniert Nutritional Facts?",a6:"Nährwerte werden getrennt von den Zutaten analysiert. BOTIA beginnt mit den deklarierten Werten. Ein fehlender, unlesbarer oder ungültiger Wert wird nicht als null behandelt. Externer Referenzkontext wird nur ergänzt, wenn er gültig ist.",q7:"Was bedeutet „nichts markiert“?",a7:"Es bedeutet, dass BOTIA für die angezeigten Ebenen kein aktives Signal gefunden hat. Es bedeutet nicht automatisch, dass das Produkt gesund, sicher, für alle geeignet oder frei von jedem möglichen Problem ist.",q8:"Was geschieht mit meinen Fotos und dem Verlauf?",a8:"BOTIA ist darauf ausgelegt, gespeicherte Daten zu minimieren. Scan-Fotos sind nicht Teil des gespeicherten Verlaufs. Der lokale Verlauf behält nur die Mindestinformationen, die zur Rekonstruktion eines Ergebnisses nötig sind. Details stehen in der Datenschutzerklärung.",q9:"Welche Sprachen unterstützt BOTIA?",a9:"BOTIA unterstützt Englisch, Spanisch, Arabisch, Deutsch, Französisch, Indonesisch, Italienisch, Niederländisch, Polnisch, Portugiesisch, Rumänisch, Russisch, Türkisch und Chinesisch.",q10:"Wie funktionieren kostenlose Scans und das Abonnement?",a10:"BOTIA enthält 5 kostenlose Scans. Danach ist für weitere Scans ein Jahresabonnement erforderlich. Die App zeigt den aktuellen Preis und die Abrechnungsbedingungen vor dem Kauf. Premium-Nutzung ist auf 300 Scans pro Monat begrenzt.",contact_title:"Noch Hilfe nötig?",contact_body:"Wenn ein Ergebnis falsch wirkt, ein Etikett nicht gelesen werden kann oder etwas in der App nicht funktioniert, kontaktiere den BOTIA-Support und beschreibe, was passiert ist. Sende keine sensiblen personenbezogenen Daten.",privacy:"Datenschutzerklärung",about:"Über BOTIA"},
fr:{skip_link:"Aller au contenu principal",kicker:"AIDE",title:"Aide & FAQ",subtitle:"Réponses sur le scan des étiquettes, Choices, Evidence, code-barres, nutrition, confidentialité et accès.",intro_title:"Commencez par l’étiquette",intro_body:"BOTIA part de ce que l’emballage déclare réellement. La liste des ingrédients est la source principale pour l’analyse. Le code-barres / GTIN et les sources externes peuvent ajouter de la traçabilité, mais ne remplacent pas l’étiquette.",faq_title:"Questions fréquentes",q1:"Qu’est-ce que BOTIA ?",a1:"BOTIA est un outil d’intelligence des étiquettes alimentaires. Il lit la liste d’ingrédients et organise ce qu’il trouve en explications, couches Evidence, contexte réglementaire et Choices personnelles. Il apporte du contexte, pas une note unique ni un jugement moral.",q2:"Comment scanner un produit ?",a2:"Photographiez la liste d’ingrédients de façon à ce que tout le texte soit visible et lisible. Vous pouvez aussi capturer le tableau nutritionnel et un code-barres / GTIN pour la même session produit.",q3:"BOTIA utilise-t-il le code-barres pour analyser les ingrédients ?",a3:"Non. L’analyse part de la liste réelle imprimée sur l’emballage. Le code-barres / GTIN sert à l’identification et à la traçabilité. Il peut ajouter du contexte, mais ne remplace pas l’étiquette.",q4:"Quelle est la différence entre Choices et Evidence ?",a4:"Choices sont des vues personnelles persistantes comme Animal, Woman et Muslim. Les couches Evidence apparaissent lorsque l’analyse trouve des signaux pertinents, par exemple Sugar, Sweeteners, Flavours, Texture ou E-numbers. BOTIA garde ces deux éléments séparés.",q5:"Muslim Choice signifie-t-il une certification halal ?",a5:"Non. BOTIA n’est pas un organisme de certification halal. Il peut afficher Halal, Haram ou Doubt / Mushbooh selon ce que soutiennent la liste d’ingrédients et les preuves disponibles. Lorsque l’origine ou le procédé ne peut pas être établi, l’incertitude reste visible.",q6:"Comment fonctionne Nutritional Facts ?",a6:"La nutrition est analysée séparément des ingrédients. BOTIA part des valeurs déclarées. Une valeur absente, illisible ou invalide n’est pas traitée comme zéro. Un contexte de référence externe n’est ajouté que lorsqu’il est valide.",q7:"Que signifie « rien de signalé » ?",a7:"Cela signifie que BOTIA n’a trouvé aucun signal actif pour les couches affichées. Cela ne signifie pas que le produit est automatiquement sain, sûr, adapté à tout le monde ou exempt de toute préoccupation possible.",q8:"Que deviennent mes photos et mon historique ?",a8:"BOTIA est conçu pour réduire au minimum les données stockées. Les photos de scan ne font pas partie de l’historique enregistré. L’historique local conserve le minimum nécessaire pour reconstruire un résultat. Consultez la Politique de confidentialité.",q9:"Quelles langues BOTIA prend-il en charge ?",a9:"BOTIA prend en charge l’anglais, l’espagnol, l’arabe, l’allemand, le français, l’indonésien, l’italien, le néerlandais, le polonais, le portugais, le roumain, le russe, le turc et le chinois.",q10:"Comment fonctionnent les scans gratuits et l’abonnement ?",a10:"BOTIA inclut 5 scans gratuits. Une fois utilisés, continuer à scanner nécessite l’abonnement annuel. L’application affiche le prix actuel et les conditions de facturation avant l’achat. L’usage premium est limité à 300 scans par mois.",contact_title:"Encore besoin d’aide ?",contact_body:"Si un résultat semble incorrect, si une étiquette ne peut pas être lue ou si quelque chose ne fonctionne pas dans l’application, contactez l’assistance BOTIA et décrivez ce qui s’est passé. N’envoyez pas d’informations personnelles sensibles.",privacy:"Politique de confidentialité",about:"À propos de BOTIA"},
nl:{skip_link:"Naar hoofdinhoud",kicker:"HULP",title:"Hulp & FAQ",subtitle:"Antwoorden over labels scannen, Choices, Evidence, barcode, voeding, privacy en toegang.",intro_title:"Begin bij het etiket",intro_body:"BOTIA begint met wat de verpakking daadwerkelijk vermeldt. De ingrediëntenlijst is de primaire bron voor ingrediëntenanalyse. Barcode / GTIN en externe bronnen kunnen traceerbaarheid toevoegen, maar vervangen het etiket niet.",faq_title:"Veelgestelde vragen",q1:"Wat is BOTIA?",a1:"BOTIA is food-label intelligence. Het leest de ingrediëntenlijst en ordent wat het vindt in uitleg over ingrediënten, Evidence-lagen, regelgevingscontext en persoonlijke Choices. Het geeft context, geen enkele score of moreel oordeel.",q2:"Hoe scan ik een product?",a2:"Fotografeer de ingrediëntenlijst zodat alle tekst zichtbaar en leesbaar is. Je kunt ook de voedingswaardetabel en een barcode / GTIN vastleggen voor dezelfde productsessie.",q3:"Gebruikt BOTIA de barcode om ingrediënten te analyseren?",a3:"Nee. Ingrediëntenanalyse begint met de echte ingrediëntenlijst op de verpakking. Barcode / GTIN wordt gebruikt voor productidentificatie en traceerbaarheid. Het kan context toevoegen, maar vervangt het etiket niet.",q4:"Wat is het verschil tussen Choices en Evidence?",a4:"Choices zijn blijvende persoonlijke weergaven zoals Animal, Woman en Muslim. Evidence-lagen verschijnen wanneer de analyse relevante signalen vindt, bijvoorbeeld Sugar, Sweeteners, Flavours, Texture of E-numbers. BOTIA houdt deze twee zaken apart.",q5:"Betekent Muslim Choice halal-certificering?",a5:"Nee. BOTIA is geen halal-certificeringsinstantie. Het kan Halal, Haram of Doubt / Mushbooh tonen op basis van wat de ingrediëntenlijst en beschikbare onderbouwing ondersteunen. Wanneer oorsprong of proces niet kan worden vastgesteld, blijft die onzekerheid zichtbaar.",q6:"Hoe werkt Nutritional Facts?",a6:"Voeding wordt apart van ingrediënten geanalyseerd. BOTIA begint met de gedeclareerde waarden. Een ontbrekende, onleesbare of ongeldige waarde wordt niet als nul behandeld. Externe referentiecontext wordt alleen toegevoegd wanneer die geldig is.",q7:"Wat betekent ‘niets gemarkeerd’?",a7:"Het betekent dat BOTIA geen actief signaal vond voor de getoonde lagen. Het betekent niet automatisch dat het product gezond, veilig, voor iedereen geschikt of vrij van elk mogelijk aandachtspunt is.",q8:"Wat gebeurt er met mijn foto’s en geschiedenis?",a8:"BOTIA is ontworpen om opgeslagen gegevens te beperken. Scanfoto’s maken geen deel uit van de opgeslagen geschiedenis. Lokale geschiedenis bewaart alleen de minimale informatie die nodig is om een resultaat te reconstrueren. Zie het Privacybeleid.",q9:"Welke talen ondersteunt BOTIA?",a9:"BOTIA ondersteunt Engels, Spaans, Arabisch, Duits, Frans, Indonesisch, Italiaans, Nederlands, Pools, Portugees, Roemeens, Russisch, Turks en Chinees.",q10:"Hoe werken gratis scans en het abonnement?",a10:"BOTIA bevat 5 gratis scans. Daarna is voor verder scannen een jaarabonnement nodig. De app toont vóór aankoop de actuele prijs en factureringsvoorwaarden. Premiumgebruik is beperkt tot 300 scans per maand.",contact_title:"Nog hulp nodig?",contact_body:"Als een resultaat onjuist lijkt, een etiket niet kan worden gelezen of iets in de app niet werkt, neem dan contact op met BOTIA-support en beschrijf wat er gebeurde. Stuur geen gevoelige persoonsgegevens.",privacy:"Privacybeleid",about:"Over BOTIA"},
it:{skip_link:"Vai al contenuto principale",kicker:"AIUTO",title:"Aiuto & FAQ",subtitle:"Risposte su scansione delle etichette, Choices, Evidence, codice a barre, nutrizione, privacy e accesso.",intro_title:"Parti dall’etichetta",intro_body:"BOTIA parte da ciò che la confezione dichiara realmente. L’elenco degli ingredienti è la fonte principale per l’analisi. Codice a barre / GTIN e fonti esterne possono aggiungere tracciabilità, ma non sostituiscono l’etichetta.",faq_title:"Domande frequenti",q1:"Che cos’è BOTIA?",a1:"BOTIA è uno strumento di food-label intelligence. Legge l’elenco degli ingredienti e organizza ciò che trova in spiegazioni, livelli Evidence, contesto normativo e Choices personali. Offre contesto, non un punteggio unico né un giudizio morale.",q2:"Come scansiono un prodotto?",a2:"Fotografa l’elenco degli ingredienti in modo che tutto il testo sia visibile e leggibile. Puoi anche acquisire la tabella nutrizionale e un codice a barre / GTIN nella stessa sessione prodotto.",q3:"BOTIA usa il codice a barre per analizzare gli ingredienti?",a3:"No. L’analisi degli ingredienti parte dall’elenco reale stampato sulla confezione. Il codice a barre / GTIN serve per identificazione e tracciabilità del prodotto. Può aggiungere contesto, ma non sostituisce l’etichetta.",q4:"Qual è la differenza tra Choices ed Evidence?",a4:"Choices sono viste personali persistenti come Animal, Woman e Muslim. I livelli Evidence compaiono quando l’analisi trova segnali pertinenti, per esempio Sugar, Sweeteners, Flavours, Texture o E-numbers. BOTIA mantiene separate le due cose.",q5:"Muslim Choice significa certificazione halal?",a5:"No. BOTIA non è un ente di certificazione halal. Può mostrare Halal, Haram o Doubt / Mushbooh in base a ciò che l’elenco degli ingredienti e le evidenze disponibili supportano. Quando origine o processo non possono essere stabiliti, l’incertezza resta visibile.",q6:"Come funziona Nutritional Facts?",a6:"La nutrizione viene analizzata separatamente dagli ingredienti. BOTIA parte dai valori dichiarati. Un valore mancante, illeggibile o non valido non viene trattato come zero. Il contesto di riferimento esterno viene aggiunto solo quando è valido.",q7:"Cosa significa “nessun elemento segnalato”?",a7:"Significa che BOTIA non ha trovato un segnale attivo per i livelli visualizzati. Non significa che il prodotto sia automaticamente sano, sicuro, adatto a tutti o privo di ogni possibile criticità.",q8:"Cosa succede alle mie foto e alla cronologia?",a8:"BOTIA è progettato per ridurre al minimo i dati memorizzati. Le foto di scansione non fanno parte della cronologia salvata. La cronologia locale conserva solo le informazioni minime necessarie per ricostruire un risultato. Consulta l’Informativa sulla privacy.",q9:"Quali lingue supporta BOTIA?",a9:"BOTIA supporta inglese, spagnolo, arabo, tedesco, francese, indonesiano, italiano, olandese, polacco, portoghese, rumeno, russo, turco e cinese.",q10:"Come funzionano le scansioni gratuite e l’abbonamento?",a10:"BOTIA include 5 scansioni gratuite. Una volta usate, per continuare a scansionare è necessario l’abbonamento annuale. L’app mostra il prezzo corrente e le condizioni di fatturazione prima dell’acquisto. L’uso premium è limitato a 300 scansioni al mese.",contact_title:"Hai ancora bisogno di aiuto?",contact_body:"Se un risultato sembra errato, un’etichetta non può essere letta o qualcosa nell’app non funziona, contatta l’assistenza BOTIA e descrivi cosa è successo. Non inviare informazioni personali sensibili.",privacy:"Informativa sulla privacy",about:"Informazioni su BOTIA"}
});

pt:{skip_link:"Saltar para o conteúdo principal",kicker:"AJUDA",title:"Ajuda & FAQ",subtitle:"Respostas sobre leitura de rótulos, Choices, Evidence, código de barras, nutrição, privacidade e acesso.",intro_title:"Comece pelo rótulo",intro_body:"A BOTIA parte do que a embalagem realmente declara. A lista de ingredientes é a fonte principal para a análise. Código de barras / GTIN e fontes externas podem acrescentar rastreabilidade, mas não substituem o rótulo.",faq_title:"Perguntas frequentes",q1:"O que é a BOTIA?",a1:"A BOTIA é uma ferramenta de inteligência de rótulos alimentares. Lê a lista de ingredientes e organiza o que encontra em explicações, camadas Evidence, contexto regulatório e Choices pessoais. Dá contexto, não uma pontuação única nem um julgamento moral.",q2:"Como faço a leitura de um produto?",a2:"Fotografe a lista de ingredientes de modo que todo o texto esteja visível e legível. Também pode captar a tabela nutricional e um código de barras / GTIN na mesma sessão do produto.",q3:"A BOTIA usa o código de barras para analisar ingredientes?",a3:"Não. A análise começa pela lista real impressa na embalagem. O código de barras / GTIN é usado para identificação e rastreabilidade. Pode acrescentar contexto, mas não substitui o rótulo.",q4:"Qual é a diferença entre Choices e Evidence?",a4:"Choices são vistas pessoais persistentes, como Animal, Woman e Muslim. As camadas Evidence aparecem quando a análise encontra sinais relevantes, por exemplo Sugar, Sweeteners, Flavours, Texture ou E-numbers. A BOTIA mantém estas duas coisas separadas.",q5:"Muslim Choice significa certificação halal?",a5:"Não. A BOTIA não é uma entidade certificadora halal. Pode mostrar Halal, Haram ou Doubt / Mushbooh de acordo com o que a lista de ingredientes e as evidências disponíveis sustentam. Quando a origem ou o processo não podem ser determinados, a incerteza permanece visível.",q6:"Como funciona Nutritional Facts?",a6:"A nutrição é analisada separadamente dos ingredientes. A BOTIA parte dos valores declarados. Um valor ausente, ilegível ou inválido não é tratado como zero. O contexto de referência externo só é acrescentado quando é válido.",q7:"O que significa “nada assinalado”?",a7:"Significa que a BOTIA não encontrou um sinal ativo para as camadas apresentadas. Não significa que o produto seja automaticamente saudável, seguro, adequado para todas as pessoas ou livre de qualquer possível preocupação.",q8:"O que acontece às minhas fotos e ao histórico?",a8:"A BOTIA foi concebida para minimizar os dados armazenados. As fotografias de leitura não fazem parte do histórico guardado. O histórico local conserva apenas a informação mínima necessária para reconstruir um resultado. Consulte a Política de Privacidade.",q9:"Que idiomas a BOTIA suporta?",a9:"A BOTIA suporta inglês, espanhol, árabe, alemão, francês, indonésio, italiano, neerlandês, polaco, português, romeno, russo, turco e chinês.",q10:"Como funcionam as leituras gratuitas e a subscrição?",a10:"A BOTIA inclui 5 leituras gratuitas. Depois de utilizadas, continuar a ler produtos requer a subscrição anual. A aplicação mostra o preço atual e as condições de faturação antes da compra. O uso premium está limitado a 300 leituras por mês.",contact_title:"Ainda precisa de ajuda?",contact_body:"Se um resultado parecer incorreto, um rótulo não puder ser lido ou algo na aplicação não funcionar, contacte o suporte da BOTIA e descreva o que aconteceu. Não envie informações pessoais sensíveis.",privacy:"Política de Privacidade",about:"Sobre a BOTIA"},
pl:{skip_link:"Przejdź do głównej treści",kicker:"POMOC",title:"Pomoc i FAQ",subtitle:"Odpowiedzi dotyczące skanowania etykiet, Choices, Evidence, kodów kreskowych, żywienia, prywatności i dostępu.",intro_title:"Zacznij od etykiety",intro_body:"BOTIA zaczyna od tego, co faktycznie deklaruje opakowanie. Lista składników jest podstawowym źródłem analizy. Kod kreskowy / GTIN i źródła zewnętrzne mogą dodać informacje o identyfikacji i śledzeniu produktu, ale nie zastępują etykiety.",faq_title:"Najczęściej zadawane pytania",q1:"Czym jest BOTIA?",a1:"BOTIA to narzędzie do analizy informacji na etykietach żywności. Czyta listę składników i porządkuje wyniki w objaśnienia, warstwy Evidence, kontekst regulacyjny i osobiste Choices. Dostarcza kontekstu, a nie jednej oceny ani moralnego werdyktu.",q2:"Jak zeskanować produkt?",a2:"Zrób zdjęcie listy składników tak, aby cały tekst był widoczny i czytelny. Możesz też zeskanować tabelę wartości odżywczych oraz kod kreskowy / GTIN w tej samej sesji produktu.",q3:"Czy BOTIA używa kodu kreskowego do analizy składników?",a3:"Nie. Analiza zaczyna się od rzeczywistej listy składników na opakowaniu. Kod kreskowy / GTIN służy do identyfikacji i śledzenia produktu. Może dodać kontekst, ale nie zastępuje etykiety.",q4:"Jaka jest różnica między Choices a Evidence?",a4:"Choices to trwałe osobiste widoki, takie jak Animal, Woman i Muslim. Warstwy Evidence pojawiają się, gdy analiza wykryje istotne sygnały, na przykład Sugar, Sweeteners, Flavours, Texture lub E-numbers. BOTIA utrzymuje te dwa obszary oddzielnie.",q5:"Czy Muslim Choice oznacza certyfikat halal?",a5:"Nie. BOTIA nie jest jednostką certyfikującą halal. Może pokazać Halal, Haram lub Doubt / Mushbooh zgodnie z tym, co wspiera lista składników i dostępne dowody. Gdy nie można ustalić pochodzenia lub procesu, niepewność pozostaje widoczna.",q6:"Jak działa Nutritional Facts?",a6:"Informacje żywieniowe są analizowane oddzielnie od składników. BOTIA zaczyna od wartości zadeklarowanych w tabeli żywieniowej. Brakująca, nieczytelna lub nieprawidłowa wartość nie jest traktowana jako zero. Zewnętrzny kontekst referencyjny jest dodawany tylko wtedy, gdy jest prawidłowy.",q7:"Co oznacza „nic nie zaznaczono”?",a7:"Oznacza to, że BOTIA nie znalazła aktywnego sygnału dla wyświetlanych warstw. Nie oznacza to automatycznie, że produkt jest zdrowy, bezpieczny, odpowiedni dla wszystkich lub wolny od każdego możliwego problemu.",q8:"Co dzieje się z moimi zdjęciami i historią?",a8:"BOTIA została zaprojektowana tak, aby minimalizować przechowywane dane. Zdjęcia skanów nie są częścią zapisanej historii. Lokalna historia przechowuje tylko minimalne informacje potrzebne do odtworzenia wyniku. Szczegóły opisuje Polityka prywatności.",q9:"Jakie języki obsługuje BOTIA?",a9:"BOTIA obsługuje angielski, hiszpański, arabski, niemiecki, francuski, indonezyjski, włoski, niderlandzki, polski, portugalski, rumuński, rosyjski, turecki i chiński.",q10:"Jak działają bezpłatne skany i subskrypcja?",a10:"BOTIA obejmuje 5 bezpłatnych skanów. Po ich wykorzystaniu dalsze skanowanie wymaga rocznej subskrypcji. Aplikacja pokazuje aktualną cenę i warunki płatności przed zakupem. Użycie premium jest ograniczone do 300 skanów miesięcznie.",contact_title:"Nadal potrzebujesz pomocy?",contact_body:"Jeśli wynik wygląda nieprawidłowo, etykiety nie da się odczytać lub coś w aplikacji nie działa, skontaktuj się z pomocą BOTIA i opisz, co się wydarzyło. Nie wysyłaj wrażliwych danych osobowych.",privacy:"Polityka prywatności",about:"O BOTIA"},
ro:{skip_link:"Sari la conținutul principal",kicker:"AJUTOR",title:"Ajutor și FAQ",subtitle:"Răspunsuri despre scanarea etichetelor, Choices, Evidence, coduri de bare, nutriție, confidențialitate și acces.",intro_title:"Începe cu eticheta",intro_body:"BOTIA pornește de la ceea ce declară efectiv ambalajul. Lista de ingrediente este sursa principală pentru analiză. Codul de bare / GTIN și sursele externe pot adăuga trasabilitate, dar nu înlocuiesc eticheta.",faq_title:"Întrebări frecvente",q1:"Ce este BOTIA?",a1:"BOTIA este un instrument de inteligență pentru etichete alimentare. Citește lista de ingrediente și organizează ceea ce găsește în explicații, straturi Evidence, context de reglementare și Choices personale. Oferă context, nu un scor unic și nici un verdict moral.",q2:"Cum scanez un produs?",a2:"Fotografiază lista de ingrediente astfel încât tot textul să fie vizibil și lizibil. Poți captura și tabelul nutrițional și un cod de bare / GTIN în aceeași sesiune de produs.",q3:"BOTIA folosește codul de bare pentru a analiza ingredientele?",a3:"Nu. Analiza pornește de la lista reală de ingrediente de pe ambalaj. Codul de bare / GTIN este folosit pentru identificare și trasabilitate. Poate adăuga context, dar nu înlocuiește eticheta.",q4:"Care este diferența dintre Choices și Evidence?",a4:"Choices sunt vizualizări personale persistente, precum Animal, Woman și Muslim. Straturile Evidence apar atunci când analiza găsește semnale relevante, de exemplu Sugar, Sweeteners, Flavours, Texture sau E-numbers. BOTIA păstrează aceste două lucruri separate.",q5:"Muslim Choice înseamnă certificare halal?",a5:"Nu. BOTIA nu este un organism de certificare halal. Poate afișa Halal, Haram sau Doubt / Mushbooh conform celor susținute de lista de ingrediente și dovezile disponibile. Când originea sau procesul nu pot fi stabilite, incertitudinea rămâne vizibilă.",q6:"Cum funcționează Nutritional Facts?",a6:"Nutriția este analizată separat de ingrediente. BOTIA pornește de la valorile declarate. O valoare lipsă, ilizibilă sau invalidă nu este tratată ca zero. Contextul extern de referință este adăugat doar când este valid.",q7:"Ce înseamnă „nimic semnalat”?",a7:"Înseamnă că BOTIA nu a găsit un semnal activ pentru straturile afișate. Nu înseamnă automat că produsul este sănătos, sigur, potrivit pentru toată lumea sau lipsit de orice posibilă problemă.",q8:"Ce se întâmplă cu fotografiile și istoricul meu?",a8:"BOTIA este concepută pentru a minimiza datele stocate. Fotografiile scanărilor nu fac parte din istoricul salvat. Istoricul local păstrează doar informațiile minime necesare pentru a reconstrui un rezultat. Consultă Politica de confidențialitate.",q9:"Ce limbi acceptă BOTIA?",a9:"BOTIA acceptă engleză, spaniolă, arabă, germană, franceză, indoneziană, italiană, neerlandeză, poloneză, portugheză, română, rusă, turcă și chineză.",q10:"Cum funcționează scanările gratuite și abonamentul?",a10:"BOTIA include 5 scanări gratuite. După folosirea lor, scanarea în continuare necesită abonamentul anual. Aplicația afișează prețul curent și condițiile de facturare înainte de cumpărare. Utilizarea premium este limitată la 300 de scanări pe lună.",contact_title:"Mai ai nevoie de ajutor?",contact_body:"Dacă un rezultat pare greșit, o etichetă nu poate fi citită sau ceva din aplicație nu funcționează, contactează suportul BOTIA și descrie ce s-a întâmplat. Nu trimite informații personale sensibile.",privacy:"Politica de confidențialitate",about:"Despre BOTIA"},
ru:{skip_link:"Перейти к основному содержимому",kicker:"ПОМОЩЬ",title:"Помощь и FAQ",subtitle:"Ответы о сканировании этикеток, Choices, Evidence, штрихкодах, питании, конфиденциальности и доступе.",intro_title:"Начните с этикетки",intro_body:"BOTIA начинает с того, что фактически указано на упаковке. Список ингредиентов — основной источник для анализа. Штрихкод / GTIN и внешние источники могут добавить данные для идентификации и прослеживаемости, но не заменяют этикетку.",faq_title:"Часто задаваемые вопросы",q1:"Что такое BOTIA?",a1:"BOTIA — инструмент анализа пищевых этикеток. Он читает список ингредиентов и организует найденное в объяснения, слои Evidence, нормативный контекст и персональные Choices. Он дает контекст, а не единую оценку или моральный вердикт.",q2:"Как отсканировать продукт?",a2:"Сфотографируйте список ингредиентов так, чтобы весь текст был виден и читался. Также можно снять таблицу пищевой ценности и штрихкод / GTIN в той же сессии продукта.",q3:"Использует ли BOTIA штрихкод для анализа ингредиентов?",a3:"Нет. Анализ начинается с реального списка на упаковке. Штрихкод / GTIN используется для идентификации и прослеживаемости продукта. Он может добавить контекст, но не заменяет этикетку.",q4:"В чем разница между Choices и Evidence?",a4:"Choices — постоянные персональные представления, например Animal, Woman и Muslim. Слои Evidence появляются, когда анализ находит релевантные сигналы, например Sugar, Sweeteners, Flavours, Texture или E-numbers. BOTIA разделяет эти категории.",q5:"Означает ли Muslim Choice халяль-сертификацию?",a5:"Нет. BOTIA не является органом халяль-сертификации. Он может показывать Halal, Haram или Doubt / Mushbooh в зависимости от того, что подтверждают список ингредиентов и доступные данные. Если происхождение или процесс нельзя установить, неопределенность остается видимой.",q6:"Как работает Nutritional Facts?",a6:"Пищевая ценность анализируется отдельно от ингредиентов. BOTIA начинает со значений, заявленных в таблице пищевой ценности. Отсутствующее, нечитаемое или недействительное значение не считается нулем. Внешний справочный контекст добавляется только когда он действителен.",q7:"Что означает «ничего не отмечено»?",a7:"Это означает, что BOTIA не нашла активного сигнала для отображаемых слоев. Это не означает автоматически, что продукт полезен, безопасен, подходит всем или лишен любых возможных проблем.",q8:"Что происходит с моими фотографиями и историей?",a8:"BOTIA спроектирована так, чтобы минимизировать хранимые данные. Фотографии сканирования не входят в сохраненную историю. Локальная история хранит только минимум информации, необходимой для восстановления результата. См. Политику конфиденциальности.",q9:"Какие языки поддерживает BOTIA?",a9:"BOTIA поддерживает английский, испанский, арабский, немецкий, французский, индонезийский, итальянский, нидерландский, польский, португальский, румынский, русский, турецкий и китайский.",q10:"Как работают бесплатные сканирования и подписка?",a10:"BOTIA включает 5 бесплатных сканирований. После их использования дальнейшее сканирование требует годовой подписки. Приложение показывает актуальную цену и условия оплаты до покупки. Премиум-использование ограничено 300 сканированиями в месяц.",contact_title:"Все еще нужна помощь?",contact_body:"Если результат выглядит неверным, этикетка не читается или что-то в приложении не работает, свяжитесь с поддержкой BOTIA и опишите, что произошло. Не отправляйте чувствительные персональные данные.",privacy:"Политика конфиденциальности",about:"О BOTIA"}
});

ar:{skip_link:"الانتقال إلى المحتوى الرئيسي",kicker:"مساعدة",title:"المساعدة والأسئلة الشائعة",subtitle:"إجابات حول مسح الملصقات والخيارات والأدلة والباركود والتغذية والخصوصية والوصول.",intro_title:"ابدأ بالملصق",intro_body:"تبدأ BOTIA بما يصرّح به المنتج فعليًا على العبوة. قائمة المكونات هي المصدر الأساسي للتحليل. يمكن للباركود / GTIN والمصادر الخارجية إضافة معلومات التتبع، لكنها لا تحل محل الملصق.",faq_title:"الأسئلة الشائعة",q1:"ما هي BOTIA؟",a1:"BOTIA أداة لذكاء ملصقات الأغذية. تقرأ قائمة المكونات وتنظم ما تجده في شروحات وطبقات Evidence وسياق تنظيمي وChoices شخصية. وهي تقدم سياقًا لا درجة واحدة ولا حكمًا أخلاقيًا.",q2:"كيف أمسح منتجًا؟",a2:"صوّر قائمة المكونات بحيث يكون النص كاملًا وواضحًا. ويمكنك أيضًا التقاط جدول القيم الغذائية والباركود / GTIN في جلسة المنتج نفسها.",q3:"هل تستخدم BOTIA الباركود لتحليل المكونات؟",a3:"لا. يبدأ التحليل من قائمة المكونات الفعلية على العبوة. يُستخدم الباركود / GTIN للتعرف على المنتج وتتبع معلوماته. يمكنه إضافة سياق لكنه لا يستبدل الملصق.",q4:"ما الفرق بين Choices و Evidence؟",a4:"Choices هي طرق عرض شخصية مستمرة مثل Animal وWoman وMuslim. أما طبقات Evidence فتظهر عندما يجد التحليل إشارات ذات صلة مثل Sugar وSweeteners وFlavours وTexture وE-numbers. تحافظ BOTIA على الفصل بين الاثنين.",q5:"هل Muslim Choice تعني شهادة حلال؟",a5:"لا. BOTIA ليست جهة لإصدار شهادات الحلال. يمكنها عرض Halal أو Haram أو Doubt / Mushbooh وفقًا لما تدعمه قائمة المكونات والأدلة المتاحة. وعندما لا يمكن تحديد الأصل أو طريقة التصنيع تبقى حالة عدم اليقين ظاهرة.",q6:"كيف تعمل Nutritional Facts؟",a6:"تُحلل التغذية بشكل منفصل عن المكونات. تبدأ BOTIA بالقيم المعلنة في جدول التغذية. القيمة المفقودة أو غير المقروءة أو غير الصالحة لا تُعامل على أنها صفر. ولا يضاف السياق المرجعي الخارجي إلا عندما يكون صالحًا.",q7:"ماذا يعني “لم يتم رصد شيء”؟",a7:"يعني أن BOTIA لم تجد إشارة نشطة للطبقات المعروضة. ولا يعني أن المنتج صحي أو آمن تلقائيًا أو مناسب للجميع أو خالٍ من كل مصدر محتمل للقلق.",q8:"ماذا يحدث للصور والسجل؟",a8:"صُممت BOTIA لتقليل البيانات المخزنة. صور المسح ليست جزءًا من السجل المحفوظ. يحتفظ السجل المحلي بالحد الأدنى من المعلومات اللازمة لإعادة بناء النتيجة. راجع سياسة الخصوصية للتفاصيل.",q9:"ما اللغات التي تدعمها BOTIA؟",a9:"تدعم BOTIA الإنجليزية والإسبانية والعربية والألمانية والفرنسية والإندونيسية والإيطالية والهولندية والبولندية والبرتغالية والرومانية والروسية والتركية والصينية.",q10:"كيف تعمل عمليات المسح المجانية والاشتراك؟",a10:"تتضمن BOTIA خمس عمليات مسح مجانية. بعد استخدامها يتطلب الاستمرار اشتراكًا سنويًا. يعرض التطبيق السعر الحالي وشروط الفوترة قبل الشراء. الاستخدام المميز محدود بـ300 عملية مسح شهريًا.",contact_title:"هل ما زلت بحاجة إلى مساعدة؟",contact_body:"إذا بدت نتيجة غير صحيحة أو تعذر قراءة ملصق أو لم يعمل جزء من التطبيق، تواصل مع دعم BOTIA واشرح ما حدث. لا ترسل معلومات شخصية حساسة.",privacy:"سياسة الخصوصية",about:"حول BOTIA"},
tr:{skip_link:"Ana içeriğe geç",kicker:"YARDIM",title:"Yardım ve SSS",subtitle:"Etiket tarama, Choices, Evidence, barkod, beslenme, gizlilik ve erişim hakkında yanıtlar.",intro_title:"Etiketle başlayın",intro_body:"BOTIA, ambalajın gerçekten beyan ettiği bilgilerle başlar. İçindekiler listesi analiz için ana kaynaktır. Barkod / GTIN ve dış kaynaklar ürün izlenebilirliği ekleyebilir, ancak etiketin yerini tutmaz.",faq_title:"Sık sorulan sorular",q1:"BOTIA nedir?",a1:"BOTIA bir gıda etiketi zekâ aracıdır. İçindekiler listesini okur ve bulduklarını açıklamalar, Evidence katmanları, düzenleyici bağlam ve kişisel Choices olarak düzenler. Tek bir puan veya ahlaki hüküm değil, bağlam sunar.",q2:"Bir ürünü nasıl tararım?",a2:"İçindekiler listesini tüm metin görünür ve okunabilir olacak şekilde fotoğraflayın. Aynı ürün oturumuna besin değerleri tablosunu ve barkod / GTIN’i de ekleyebilirsiniz.",q3:"BOTIA içerikleri analiz etmek için barkodu kullanır mı?",a3:"Hayır. Analiz ambalajdaki gerçek içindekiler listesiyle başlar. Barkod / GTIN ürün kimliği ve izlenebilirlik için kullanılır. Bağlam ekleyebilir ancak etiketin yerini almaz.",q4:"Choices ile Evidence arasındaki fark nedir?",a4:"Choices, Animal, Woman ve Muslim gibi kalıcı kişisel görünümlerdir. Evidence katmanları analiz Sugar, Sweeteners, Flavours, Texture veya E-numbers gibi ilgili sinyaller bulduğunda görünür. BOTIA bu iki alanı ayrı tutar.",q5:"Muslim Choice helal sertifikası anlamına mı gelir?",a5:"Hayır. BOTIA bir helal sertifikasyon kuruluşu değildir. İçindekiler listesi ve mevcut kanıtların desteklediği ölçüde Halal, Haram veya Doubt / Mushbooh gösterebilir. Köken veya süreç belirlenemediğinde belirsizlik görünür kalır.",q6:"Nutritional Facts nasıl çalışır?",a6:"Beslenme bilgileri içeriklerden ayrı analiz edilir. BOTIA beyan edilen değerlerle başlar. Eksik, okunamayan veya geçersiz bir değer sıfır olarak kabul edilmez. Dış referans bağlamı yalnızca geçerli olduğunda eklenir.",q7:"“Hiçbir şey işaretlenmedi” ne anlama gelir?",a7:"BOTIA’nın gösterilen katmanlar için aktif bir sinyal bulmadığı anlamına gelir. Ürünün otomatik olarak sağlıklı, güvenli, herkes için uygun veya her türlü olası endişeden uzak olduğu anlamına gelmez.",q8:"Fotoğraflarıma ve geçmişime ne olur?",a8:"BOTIA saklanan verileri en aza indirecek şekilde tasarlanmıştır. Tarama fotoğrafları kaydedilen geçmişin parçası değildir. Yerel geçmiş yalnızca sonucu yeniden oluşturmak için gereken asgari bilgiyi tutar. Gizlilik Politikasına bakın.",q9:"BOTIA hangi dilleri destekliyor?",a9:"BOTIA İngilizce, İspanyolca, Arapça, Almanca, Fransızca, Endonezce, İtalyanca, Felemenkçe, Lehçe, Portekizce, Romence, Rusça, Türkçe ve Çinceyi destekler.",q10:"Ücretsiz taramalar ve abonelik nasıl çalışır?",a10:"BOTIA 5 ücretsiz tarama içerir. Bunlar kullanıldıktan sonra taramaya devam etmek için yıllık abonelik gerekir. Uygulama satın alma öncesinde güncel fiyatı ve faturalandırma koşullarını gösterir. Premium kullanım ayda 300 taramayla sınırlıdır.",contact_title:"Hâlâ yardıma mı ihtiyacınız var?",contact_body:"Bir sonuç yanlış görünüyorsa, etiket okunamıyorsa veya uygulamada bir şey çalışmıyorsa BOTIA desteğine ulaşın ve ne olduğunu açıklayın. Hassas kişisel bilgi göndermeyin.",privacy:"Gizlilik Politikası",about:"BOTIA hakkında"},
zh:{skip_link:"跳转到主要内容",kicker:"帮助",title:"帮助与常见问题",subtitle:"关于标签扫描、Choices、Evidence、条码、营养、隐私和访问的说明。",intro_title:"从标签开始",intro_body:"BOTIA 从包装上实际声明的信息开始。配料表是分析的主要来源。条码 / GTIN 和外部来源可以增加产品识别与追溯信息，但不能替代标签。",faq_title:"常见问题",q1:"BOTIA 是什么？",a1:"BOTIA 是食品标签信息工具。它读取配料表，并将结果整理为说明、Evidence 层、监管背景和个人 Choices。它提供背景信息，而不是单一评分或道德判断。",q2:"如何扫描产品？",a2:"拍摄配料表时，请确保全部文字清晰可见。若希望纳入同一产品会话，也可以拍摄营养成分表和条码 / GTIN。",q3:"BOTIA 会用条码分析配料吗？",a3:"不会。分析从包装上的真实配料表开始。条码 / GTIN 用于产品识别和追溯，可以补充背景，但不能替代标签。",q4:"Choices 和 Evidence 有什么区别？",a4:"Choices 是持续保留的个人视图，例如 Animal、Woman 和 Muslim。Evidence 层会在分析发现相关信号时出现，例如 Sugar、Sweeteners、Flavours、Texture 或 E-numbers。BOTIA 将两者明确分开。",q5:"Muslim Choice 是否等于清真认证？",a5:"不是。BOTIA 不是清真认证机构。它可以根据配料表和现有证据支持的程度显示 Halal、Haram 或 Doubt / Mushbooh。当来源或加工过程无法确定时，不确定性会保留可见。",q6:"Nutritional Facts 如何工作？",a6:"营养信息与配料分开分析。BOTIA 从营养成分表中声明的数值开始。缺失、无法读取或无效的数值不会被当作零。只有在有效时才会加入外部参考背景。",q7:"“未标记任何内容”是什么意思？",a7:"这表示 BOTIA 没有在当前显示的层中发现活动信号。它并不意味着产品自动就是健康、安全、适合所有人，或不存在任何可能的问题。",q8:"我的照片和历史记录会怎样？",a8:"BOTIA 的设计目标是尽量减少存储数据。扫描照片不属于保存的历史记录。本地历史仅保留重建结果所需的最少信息。当前版本的具体处理方式请查看隐私政策。",q9:"BOTIA 支持哪些语言？",a9:"BOTIA 支持英语、西班牙语、阿拉伯语、德语、法语、印度尼西亚语、意大利语、荷兰语、波兰语、葡萄牙语、罗马尼亚语、俄语、土耳其语和中文。",q10:"免费扫描和订阅如何工作？",a10:"BOTIA 提供 5 次免费扫描。使用完后，继续扫描需要年度订阅。应用会在购买前显示当前价格和计费条款。高级使用每月最多 300 次扫描。",contact_title:"仍然需要帮助？",contact_body:"如果结果看起来不正确、标签无法读取或应用中的某项功能无法工作，请联系 BOTIA 支持并说明发生了什么。请勿发送敏感个人信息。",privacy:"隐私政策",about:"关于 BOTIA"},
id:{skip_link:"Lewati ke konten utama",kicker:"BANTUAN",title:"Bantuan & FAQ",subtitle:"Jawaban tentang pemindaian label, Choices, Evidence, barcode, nutrisi, privasi, dan akses.",intro_title:"Mulai dari label",intro_body:"BOTIA memulai dari apa yang benar-benar dinyatakan pada kemasan. Daftar bahan adalah sumber utama untuk analisis. Barcode / GTIN dan sumber eksternal dapat menambah keterlacakan produk, tetapi tidak menggantikan label.",faq_title:"Pertanyaan yang sering diajukan",q1:"Apa itu BOTIA?",a1:"BOTIA adalah alat intelijen label pangan. BOTIA membaca daftar bahan dan mengatur temuannya menjadi penjelasan, lapisan Evidence, konteks regulasi, dan Choices pribadi. BOTIA memberi konteks, bukan satu skor atau penilaian moral.",q2:"Bagaimana cara memindai produk?",a2:"Foto daftar bahan agar seluruh teks terlihat dan dapat dibaca. Anda juga dapat mengambil tabel nutrisi dan barcode / GTIN dalam sesi produk yang sama.",q3:"Apakah BOTIA memakai barcode untuk menganalisis bahan?",a3:"Tidak. Analisis dimulai dari daftar bahan sebenarnya pada kemasan. Barcode / GTIN digunakan untuk identifikasi dan keterlacakan produk. Barcode dapat menambah konteks, tetapi tidak menggantikan label.",q4:"Apa perbedaan Choices dan Evidence?",a4:"Choices adalah tampilan pribadi yang tetap, seperti Animal, Woman, dan Muslim. Lapisan Evidence muncul ketika analisis menemukan sinyal yang relevan, misalnya Sugar, Sweeteners, Flavours, Texture, atau E-numbers. BOTIA memisahkan keduanya.",q5:"Apakah Muslim Choice berarti sertifikasi halal?",a5:"Tidak. BOTIA bukan lembaga sertifikasi halal. BOTIA dapat menampilkan Halal, Haram, atau Doubt / Mushbooh sesuai dukungan daftar bahan dan bukti yang tersedia. Jika asal atau proses tidak dapat dipastikan, ketidakpastian tetap terlihat.",q6:"Bagaimana Nutritional Facts bekerja?",a6:"Nutrisi dianalisis terpisah dari bahan. BOTIA memulai dari nilai yang dinyatakan pada tabel nutrisi. Nilai yang hilang, tidak terbaca, atau tidak valid tidak dianggap nol. Konteks referensi eksternal hanya ditambahkan bila valid.",q7:"Apa arti “tidak ada yang ditandai”?",a7:"Artinya BOTIA tidak menemukan sinyal aktif untuk lapisan yang sedang ditampilkan. Ini tidak berarti produk otomatis sehat, aman, cocok untuk semua orang, atau bebas dari setiap kemungkinan masalah.",q8:"Apa yang terjadi pada foto dan riwayat saya?",a8:"BOTIA dirancang untuk meminimalkan data yang disimpan. Foto pemindaian bukan bagian dari riwayat yang disimpan. Riwayat lokal hanya menyimpan informasi minimum yang diperlukan untuk membangun kembali hasil. Lihat Kebijakan Privasi.",q9:"Bahasa apa saja yang didukung BOTIA?",a9:"BOTIA mendukung bahasa Inggris, Spanyol, Arab, Jerman, Prancis, Indonesia, Italia, Belanda, Polandia, Portugis, Rumania, Rusia, Turki, dan Tionghoa.",q10:"Bagaimana pemindaian gratis dan langganan bekerja?",a10:"BOTIA mencakup 5 pemindaian gratis. Setelah habis, pemindaian berikutnya memerlukan langganan tahunan. Aplikasi menampilkan harga dan ketentuan penagihan yang berlaku sebelum pembelian. Penggunaan premium dibatasi hingga 300 pemindaian per bulan.",contact_title:"Masih perlu bantuan?",contact_body:"Jika hasil terlihat salah, label tidak dapat dibaca, atau ada bagian aplikasi yang tidak berfungsi, hubungi dukungan BOTIA dan jelaskan apa yang terjadi. Jangan kirim informasi pribadi yang sensitif.",privacy:"Kebijakan Privasi",about:"Tentang BOTIA"}

const LANGS=["en","es","ar","de","fr","nl","it","pt","pl","ro","ru","tr","zh","id"];
function norm(v){const x=String(v||"").toLowerCase().split("-")[0];return LANGS.includes(x)?x:"en"}
function wanted(){const q=new URLSearchParams(location.search).get("lang");if(q)return norm(q);try{const s=localStorage.getItem("botia-lang");if(s)return norm(s)}catch(_){}return norm(navigator.language)}
function setHelpLanguage(l){l=norm(l);try{localStorage.setItem("botia-lang",l)}catch(_){}const u=new URL(location.href);u.searchParams.set("lang",l);location.href=u}
function render(){let l=wanted();if(!COPY[l])l="en";const c=COPY[l];document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.body.dir=document.documentElement.dir;document.getElementById("lang-select").value=l;Object.entries(c).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.textContent=v});document.getElementById("privacy_link").textContent=c.privacy;document.getElementById("about_link").textContent=c.about;document.getElementById("privacy_link").href=`/privacy.html?lang=${l}`;document.getElementById("about_link").href=`/pages/about.html?lang=${l}`;document.title="BOTIA — "+c.title}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",render,{once:true});else render();
</script>
