name: BOTIA robot questions deploy

on:
  push:
    paths:
      - "tools/robot_questions_tmp/RUN"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply and validate robot questions
        run: python tools/robot_questions_tmp/apply.py
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add localized BOTIA robot questions"
            git push
          fi
