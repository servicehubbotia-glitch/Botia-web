name: Remove legacy robot_questions

on:
  push:
    paths:
      - ".github/workflows/remove-legacy-robot-questions.yml"

permissions:
  contents: write

concurrency:
  group: remove-legacy-robot-questions
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy robot_questions from i18n JSON files
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("i18n")
          changed = 0
          removed_questions = 0
          touched = []

          for path in sorted(root.glob("*/*.json")):
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              if "robot_questions" not in data:
                  continue

              old = data.pop("robot_questions")
              if isinstance(old, list):
                  removed_questions += len(old)

              with path.open("w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write("\n")

              changed += 1
              touched.append(str(path))

          # Validate every JSON file after modification.
          for path in sorted(root.glob("*/*.json")):
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

          # Hard stop if any legacy field remains.
          remaining = []
          for path in sorted(root.glob("*/*.json")):
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)
              if "robot_questions" in data:
                  remaining.append(str(path))

          print(f"Files cleaned: {changed}")
          print(f"Legacy questions removed: {removed_questions}")
          print(f"Remaining robot_questions fields: {len(remaining)}")

          if remaining:
              print("\n".join(remaining))
              raise SystemExit("Legacy robot_questions still remain.")

      - name: Commit and push cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No legacy robot_questions fields found."
            exit 0
          fi

          git config user.name "BOTIA cleanup"
          git config user.email "botia-cleanup@users.noreply.github.com"

          git add i18n
          git commit -m "Remove legacy robot_questions from i18n"
          git pull --rebase origin main
          git push origin HEAD:main
