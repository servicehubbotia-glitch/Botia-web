name: BOTIA IndexNow submit

on:
  push:
    paths:
      - "tools/indexnow/RUN"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit changed BOTIA URLs to IndexNow
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request, urllib.error

          candidates = [
              p for p in Path(".").glob("*.txt")
              if len(p.stem) == 32 and all(c in "0123456789abcdefABCDEF" for c in p.stem)
          ]
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one 32-hex IndexNow key file, found: {candidates}")

          key_file = candidates[0]
          key = key_file.read_text(encoding="utf-8").strip()
          if key != key_file.stem:
              raise SystemExit("IndexNow key file content does not match filename")

          host = "www.botia-safefood.com"
          key_location = f"https://{host}/{key_file.name}"
          langs = ["ar","de","en","es","fr","id","it","nl","pl","pt","ro","ru","tr","zh"]
          pages = [
              "try.html",
              "terms.html",
              "legal.html",
              "privacy.html",
              "pages/animal.html",
              "help.html",
              "pages/evidence.html",
              "pages/nutrition.html",
          ]

          urls = []
          for page in pages:
              urls.append(f"https://{host}/{page}")
              for lang in langs:
                  urls.append(f"https://{host}/{page}?lang={lang}")

          statuses = []
          for i in range(0, len(urls), 100):
              batch = urls[i:i+100]
              payload = json.dumps({
                  "host": host,
                  "key": key,
                  "keyLocation": key_location,
                  "urlList": batch,
              }).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=payload,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      code = resp.status
                      body = resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  code = exc.code
                  body = exc.read().decode("utf-8", errors="replace")

              print(f"BATCH {i//100+1}: HTTP {code}; URLs={len(batch)}; BODY={body[:500]}")
              statuses.append(code)

          if not all(code in (200, 202) for code in statuses):
              raise SystemExit(f"IndexNow submission failed: {statuses}")

          print(f"INDEXNOW_OK total_urls={len(urls)} statuses={statuses}")
          PY

      - name: Remove temporary IndexNow workflow files
        run: |
          rm -rf tools/indexnow
          rm -f .github/workflows/botia-indexnow-submit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary IndexNow submitter"
          git push
