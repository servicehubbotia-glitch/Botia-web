<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOTIA — Muslim Food Transparency</title>
  <meta name="description" content="BOTIA helps you understand what a food label really says." />
  <link rel="icon" type="image/png" href="/botia_jar_512.png" />
  <link rel="stylesheet" href="/botia-landing.css" />
  <style>
    .lang-switcher { position: fixed; top: 12px; right: 16px; z-index: 100; }
    body[dir="rtl"] .lang-switcher { right: auto; left: 16px; }
    .lang-switcher select { background: rgba(24,13,13,0.96); color: #f2e4dc; border: 1px solid rgba(190,122,72,0.42); border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }
    @media (max-width:400px) { .lang-switcher { top:8px; right:8px; } .lang-switcher select { font-size:0.75rem; padding:4px 8px; } }
    .status-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin: 24px 0; }
    @media (max-width:500px) { .status-grid { grid-template-columns: 1fr; } }
    .status-card { background: rgba(24,13,13,0.9); border: 1px solid rgba(190,122,72,0.3); border-radius: 12px; padding: 20px; text-align: center; text-decoration: none; color: #f2e4dc; transition: border-color 0.2s; }
    .status-card:hover { border-color: rgba(190,122,72,0.7); }
    .status-card img { width: 48px; height: 48px; margin-bottom: 12px; }
    .status-card .status-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 6px; }
    .status-card .status-desc { font-size: 0.85rem; color: #c0a08c; line-height: 1.4; }
    .comparison-table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 0.9rem; }
    .comparison-table th, .comparison-table td { border: 1px solid rgba(190,122,72,0.2); padding: 10px 12px; text-align: left; vertical-align: top; }
    .comparison-table th { background: rgba(24,13,13,0.9); color: #f2e4dc; font-weight: 600; }
    .comparison-table td { color: #c0a08c; }
    .can-cannot { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0; }
    @media (max-width:500px) { .can-cannot { grid-template-columns: 1fr; } }
    .can-box, .cannot-box { background: rgba(24,13,13,0.9); border-radius: 12px; padding: 20px; }
    .can-box { border: 1px solid rgba(100,180,100,0.4); }
    .cannot-box { border: 1px solid rgba(180,100,100,0.4); }
    .can-box h4, .cannot-box h4 { margin-bottom: 10px; font-size: 1rem; }
    .can-box ul, .cannot-box ul { list-style: none; padding: 0; }
    .can-box li, .cannot-box li { margin-bottom: 6px; font-size: 0.9rem; color: #c0a08c; padding-left: 20px; position: relative; }
    .can-box li::before { content: "✅"; position: absolute; left: 0; }
    .cannot-box li::before { content: "❌"; position: absolute; left: 0; }
  </style>
</head>
<body>
  <div class="lang-switcher">
    <select id="lang-select" onchange="cambiarIdioma(this.value)">
      <option value="en">English</option>
      <option value="ar">العربية</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="it">Italiano</option>
      <option value="nl">Nederlands</option>
      <option value="pl">Polski</option>
      <option value="pt">Português</option>
      <option value="ro">Română</option>
      <option value="ru">Русский</option>
      <option value="tr">Türkçe</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <div class="landing">
    <section class="hero">
      <img class="hero-logo" src="/botia/assets/muslim.png" alt="Muslim" />
      <h1 id="muslim_title"></h1>
      <p class="subtitle" id="muslim_subtitle"></p>
      <p class="description" id="muslim_desc"></p>
    </section>
