  <!-- TRANSLATIONS -->
  <script>
    const RTL_LANGS = ['ar'];
    const SOPORTADOS = ['ar','de','en','es','fr','id','it','nl','pl','pt','ro','ru','tr','zh'];

    function getIdioma() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('lang')) return params.get('lang');
      if (localStorage.getItem('botia-lang')) return localStorage.getItem('botia-lang');
      const nav = navigator.language.split('-')[0];
      return SOPORTADOS.includes(nav) ? nav : 'en';
    }
    
    function cambiarIdioma(lang) {
      localStorage.setItem('botia-lang', lang);
      window.location.reload();
    }

    const LANG = getIdioma();
    const langSelect = document.getElementById('lang-select');
    if (langSelect) langSelect.value = LANG;
    
    if (RTL_LANGS.includes(LANG)) {
      document.body.setAttribute('dir', 'rtl');
      document.documentElement.lang = LANG;
    }

    // Helper para leer propiedades anidadas en el JSON (ej: "halal.name")
    function getNested(obj, path) {
      return path.split('.').reduce((acc, part) => (acc && acc[part] !== undefined) ? acc[part] : undefined, obj);
    }

    // Mapa entre las claves del JSON y los IDs del HTML
    const ID_MAP = {
      "title": "muslim_title",
      "subtitle": "muslim_subtitle",
      "description": "muslim_desc",
      "states_title": "states_title",
      "halal.name": "halal_name",
      "halal.desc": "halal_desc",
      "haram.name": "haram_name",
      "haram.desc": "haram_desc",
      "mashbooh.name": "mashbooh_name",
      "mashbooh.desc": "mashbooh_desc",
      "mashbooh_why.title": "mashbooh_why_title",
      "mashbooh_why.body": "mashbooh_why_body",
      "doubts.title": "doubts_title",
      "doubts.th_label": "th_label",
      "doubts.th_general": "th_general",
      "doubts.th_halal": "th_halal",
      "doubts.th_botia": "th_botia",
      "doubts.row1.aspect": "td1_aspect",
      "doubts.row1.general": "td1_general",
      "doubts.row1.halal": "td1_halal",
      "doubts.row1.botia": "td1_botia",
      "doubts.row2.aspect": "td2_aspect",
      "doubts.row2.general": "td2_general",
      "doubts.row2.halal": "td2_halal",
      "doubts.row2.botia": "td2_botia",
      "cancannot.title": "cancannot_title",
      "can_title": "can_title",
      "can1": "can1",
      "can2": "can2",
      "can3": "can3",
      "cannot_title": "cannot_title",
      "cannot1": "cannot1",
      "cannot2": "cannot2",
      "cannot3": "cannot3",
      "closing": "closing_claim"
    };

    // ¡AQUÍ ESTÁ LA SOLUCIÓN! Ruta correcta hacia tu carpeta i18n existente
    fetch('i18n/' + LANG + '/muslim.json')
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(data => {
        Object.keys(ID_MAP).forEach(jsonPath => {
          const el = document.getElementById(ID_MAP[jsonPath]);
          const text = getNested(data, jsonPath);
          if (el && text !== undefined) {
            el.textContent = text;
          }
        });
      })
      .catch(() => { 
        // Si falla, simplemente se queda en inglés
        document.documentElement.lang = 'en'; 
      });
  </script>
