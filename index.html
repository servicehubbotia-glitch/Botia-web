<!DOCTYPE html>
<html lang="en">
<head>
  <title>BOTIA - Inteligencia Ética Alimentaria</title>
<meta name="description" content="BOTIA es el motor de inteligencia para la seguridad alimentaria. Innovación y transparencia.">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOTIA — The Ethical Food Intelligence Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;
  --gold-light:#E8D08A;
  --gold-dark:#8A6820;
  --red:#C0392B;
  --red-bright:#E74C3C;
  --dark:#0D0D0D;
  --dark2:#141414;
  --dark3:#1C1C1C;
  --dark4:#252525;
  --text:#E8E4DC;
  --text-muted:#8A8680;
  --text-dim:#555250;
}
html{scroll-behavior:smooth}
body{
  background:var(--dark);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-weight:300;
  line-height:1.7;
  overflow-x:hidden;
}

/* NOISE TEXTURE OVERLAY */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:1000;
  opacity:0.4;
}

/* CIRCUIT PATTERN BG */
.circuit-bg{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(var(--gold-dark) 1px, transparent 1px),
    linear-gradient(90deg, var(--gold-dark) 1px, transparent 1px);
  background-size:60px 60px;
  opacity:0.04;
  pointer-events:none;
}

/* ── NAV ── */
nav{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  padding:1.2rem 4rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:0.5px solid rgba(201,168,76,0.15);
  background:rgba(13,13,13,0.85);
  backdrop-filter:blur(16px);
}
.nav-logo{
  font-family:'Playfair Display',serif;
  font-size:1.4rem;
  font-weight:700;
  color:var(--gold);
  letter-spacing:0.12em;
  text-decoration:none;
}
.nav-links{
  display:flex;
  gap:2.5rem;
  list-style:none;
}
.nav-links a{
  text-decoration:none;
  color:var(--text-muted);
  font-size:0.8rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  transition:color 0.2s;
}
.nav-links a:hover{color:var(--gold)}
.nav-cta{
  background:transparent;
  border:0.5px solid var(--gold);
  color:var(--gold);
  padding:0.5rem 1.4rem;
  font-family:'DM Sans',sans-serif;
  font-size:0.78rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
  text-decoration:none;
}
.nav-cta:hover{background:var(--gold);color:var(--dark)}

/* ── HERO ── */
#hero{
  min-height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  position:relative;
  overflow:hidden;
  padding:8rem 4rem 4rem;
  gap:4rem;
}
.hero-left{position:relative;z-index:2}
.hero-eyebrow{
  font-family:'DM Mono',monospace;
  font-size:0.72rem;
  letter-spacing:0.25em;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:1.5rem;
  display:flex;
  align-items:center;
  gap:0.8rem;
}
.hero-eyebrow::before{content:'';display:block;width:32px;height:0.5px;background:var(--gold)}
h1.hero-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.8rem,5vw,4.5rem);
  font-weight:900;
  line-height:1.05;
  color:#fff;
  margin-bottom:1.5rem;
}
h1.hero-title span{color:var(--gold)}
.hero-sub{
  font-size:1.05rem;
  color:var(--text-muted);
  max-width:480px;
  margin-bottom:2.5rem;
  line-height:1.8;
}
.hero-tagline{
  border-left:2px solid var(--red);
  padding-left:1rem;
  font-style:italic;
  font-size:0.95rem;
  color:var(--text-muted);
  margin-bottom:3rem;
}
.hero-actions{display:flex;gap:1rem;flex-wrap:wrap}
.btn-primary{
  background:var(--gold);
  color:var(--dark);
  padding:0.85rem 2rem;
  font-family:'DM Sans',sans-serif;
  font-size:0.82rem;
  font-weight:500;
  letter-spacing:0.08em;
  text-transform:uppercase;
  text-decoration:none;
  transition:all 0.2s;
  border:none;
  cursor:pointer;
}
.btn-primary:hover{background:var(--gold-light)}
.btn-ghost{
  background:transparent;
  border:0.5px solid rgba(201,168,76,0.4);
  color:var(--gold);
  padding:0.85rem 2rem;
  font-family:'DM Sans',sans-serif;
  font-size:0.82rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  text-decoration:none;
  transition:all 0.2s;
  cursor:pointer;
}
.btn-ghost:hover{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.hero-right{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:2;
}
.jar-container{
  position:relative;
  width:320px;
  height:320px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.jar-glow{
  position:absolute;
  width:280px;height:280px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,0.18) 0%,transparent 70%);
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:0.6}
  50%{transform:scale(1.1);opacity:1}
}
.jar-img{
  width:260px;
  height:auto;
  position:relative;
  z-index:2;
  filter:drop-shadow(0 0 40px rgba(201,168,76,0.25));
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}
.hero-ring{
  position:absolute;
  width:360px;height:360px;
  border:0.5px solid rgba(201,168,76,0.15);
  border-radius:50%;
  animation:spin 20s linear infinite;
}
.hero-ring2{
  position:absolute;
  width:420px;height:420px;
  border:0.5px dashed rgba(201,168,76,0.08);
  border-radius:50%;
  animation:spin 30s linear infinite reverse;
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.hero-bg-line{
  position:absolute;
  top:0;bottom:0;right:0;
  width:55%;
  background:linear-gradient(135deg,transparent 40%,rgba(201,168,76,0.03) 100%);
  border-left:0.5px solid rgba(201,168,76,0.08);
}

/* SCROLL INDICATOR */
.scroll-hint{
  position:absolute;
  bottom:2rem;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0.5rem;
  color:var(--text-dim);
  font-size:0.7rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  animation:bounce 2s ease-in-out infinite;
  z-index:2;
}
.scroll-hint::after{content:'↓';font-size:1rem;color:var(--gold)}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

/* ── STATS BAR ── */
.stats-bar{
  background:var(--dark2);
  border-top:0.5px solid rgba(201,168,76,0.12);
  border-bottom:0.5px solid rgba(201,168,76,0.12);
  padding:2.5rem 4rem;
  display:grid;
  grid-template-columns:repeat(4,1fr);
