<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BOTIA · Muslim Food Transparency</title>
  <link rel="stylesheet" href="../assets/botia-template.css" />
  <link rel="stylesheet" href="../assets/botia-pages.css" />
</head>
<body>
  <div class="botia-container">

    <header class="botia-header">
      <img class="botia-icon" src="../assets/muslim.png" alt="BOTIA" />
      <h1 data-i18n="page.title"></h1>
      <p class="subtitle" data-i18n="page.intro"></p>
    </header>

    <main>
      <section class="page-section">
        <p data-i18n="page.strict_rule"></p>
      </section>

      <section class="page-section">
        <h2 data-i18n="how_botia_reads.title"></h2>
        <p data-i18n="how_botia_reads.intro"></p>

        <p>
          <span class="badge badge-halal">HALAL</span>
          <strong data-i18n="how_botia_reads.halal_title"></strong><br />
          <span data-i18n="how_botia_reads.halal_text"></span>
        </p>

        <p>
          <span class="badge badge-haram">HARAM</span>
          <strong data-i18n="how_botia_reads.haram_title"></strong><br />
          <span data-i18n="how_botia_reads.haram_text"></span>
        </p>

        <p>
          <span class="badge badge-mashbooh">MASHBOOH</span>
          <strong data-i18n="how_botia_reads.mashbooh_title"></strong><br />
          <span data-i18n="how_botia_reads.mashbooh_text"></span>
        </p>
      </section>

      <section class="page-section">
        <h2 data-i18n="mashbooh_importance.title"></h2>
        <p data-i18n="mashbooh_importance.text"></p>
      </section>

      <section class="page-section">
        <h2 data-i18n="why_doubts.title"></h2>
        <p data-i18n="why_doubts.intro"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-i18n="why_doubts.col_aspect"></th>
                <th data-i18n="why_doubts.col_general"></th>
                <th data-i18n="why_doubts.col_halal"></th>
                <th data-i18n="why_doubts.col_why"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td data-i18n="why_doubts.row1_aspect"></td>
                <td data-i18n="why_doubts.row1_general"></td>
                <td data-i18n="why_doubts.row1_halal"></td>
                <td data-i18n="why_doubts.row1_why"></td>
              </tr>
              <tr>
                <td data-i18n="why_doubts.row2_aspect"></td>
                <td data-i18n="why_doubts.row2_general"></td>
                <td data-i18n="why_doubts.row2_halal"></td>
                <td data-i18n="why_doubts.row2_why"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="page-section">
        <h2 data-i18n="cannot.title"></h2>
        <p><strong data-i18n="cannot.can_title"></strong></p>
        <ul>
          <li>✅ <span data-i18n="cannot.can_1"></span></li>
          <li>✅ <span data-i18n="cannot.can_2"></span></li>
          <li>✅ <span data-i18n="cannot.can_3"></span></li>
        </ul>
        <p><strong data-i18n="cannot.cannot_title"></strong></p>
        <ul>
          <li>❌ <span data-i18n="cannot.cannot_1"></span></li>
          <li>❌ <span data-i18n="cannot.cannot_2"></span></li>
          <li>❌ <span data-i18n="cannot.cannot_3"></span></li>
        </ul>
      </section>

      <section class="page-section">
        <h2 data-i18n="sources.title"></h2>
        <p data-i18n="sources.intro"></p>
        <p><strong data-i18n="sources.source_1"></strong></p>
        <p><strong data-i18n="sources.source_2"></strong></p>
        <p><strong data-i18n="sources.source_3"></strong></p>
        <p><strong data-i18n="sources.source_4"></strong></p>
      </section>

      <section class="page-section">
        <h2 data-i18n="related.title"></h2>
        <div class="related-grid" data-i18n="related.links"></div>
      </section>

      <section class="page-section">
        <p class="page-disclaimer" data-i18n="disclaimer"></p>
      </section>

    </main>

    <footer>
      <p>BOTIA · Transparent Food Intelligence</p>
    </footer>

  </div>

  <script src="../assets/js/botia-web-loader.js"></script>
</body>
</html>
