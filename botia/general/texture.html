<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOTIA — Texture</title>
  <link rel="stylesheet" href="../assets/botia-template.css">
</head>
<body>
  <div class="botia-container">
    <header>
      <img src="../assets/texture.png" alt="Texture Icon" class="botia-icon" style="width: 60px; margin-bottom: 15px;">
      <h1 id="title">[LOADING]</h1>
      <p id="short_message" class="subtitle">[LOADING]</p>
    </header>

    <main>
      <section>
        <h2>What BOTIA Detected</h2>
        <p id="what_detected">[LOADING]</p>
      </section>

      <section>
        <h2>Why It Matters</h2>
        <p id="why_it_matters">[LOADING]</p>
      </section>

      <section>
        <h2>What BOTIA Cannot Conclude</h2>
        <p id="what_it_cannot_conclude">[LOADING]</p>
      </section>

      <section>
        <h2>Source & Context</h2>
        <p id="source_note">[LOADING]</p>
      </section>

      <section class="botia-note">
        <h3>📖 BOTIA Note</h3>
        <p id="botia_note">[LOADING]</p>
      </section>
    </main>

    <footer>
      <p>BOTIA WebView • Transparent Food Intelligence</p>
    </footer>
  </div>

  <script src="../assets/i18n-loader.js"></script>
  <script>
    const ingredientCode = 'texture';
    const lang = new URLSearchParams(window.location.search).get('lang') || navigator.language.split('-')[0];
    BOTIA.loadTranslations('general', ingredientCode, lang);
  </script>
</body>
</html>
