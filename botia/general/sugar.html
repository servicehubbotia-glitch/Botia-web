<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOTIA — Sugar</title>
  <link rel="stylesheet" href="../assets/botia-template.css">
</head>
<body>
  <div class="botia-container">
    <header>
      <h1 id="title">[LOADING TITLE]</h1>
      <p id="short_message" class="subtitle">[LOADING SHORT MESSAGE]</p>
    </header>

    <main>
      <section>
        <h2>What BOTIA Detected</h2>
        <p id="what_detected">[LOADING DETECTION]</p>
      </section>

      <section>
        <h2>Why It Matters</h2>
        <p id="why_it_matters">[LOADING MATTERS]</p>
      </section>

      <section>
        <h2>What BOTIA Cannot Conclude</h2>
        <p id="what_it_cannot_conclude">[LOADING CANNOT]</p>
      </section>

      <section>
        <h2>Source & Context</h2>
        <p id="source_note">[LOADING SOURCE]</p>
      </section>

      <section class="botia-note">
        <h3>📖 BOTIA Note</h3>
        <p id="botia_note">[LOADING NOTE]</p>
      </section>
    </main>

    <footer>
      <p>BOTIA WebView • Transparent Food Intelligence</p>
    </footer>
  </div>

  <script src="../assets/i18n-loader.js"></script>
  <script>
    const ingredientCode = 'sugar';
    const lang = new URLSearchParams(window.location.search).get('lang') || navigator.language.split('-')[0];
    console.log('Loading:', ingredientCode, 'in:', lang);
    BOTIA.loadTranslations('general', ingredientCode, lang);
  </script>
</body>
</html>
