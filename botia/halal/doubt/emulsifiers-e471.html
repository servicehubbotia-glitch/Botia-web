<!DOCTYPE html>
<html lang="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">BOTIA</title>
  <link rel="stylesheet" href="/botia/assets/botia-template.css">
</head>

<body>
  <div class="container">

    <!-- HEADER -->
    <header>
      <div class="botia-header-icon">
        <img src="/botia_jar_512.png" alt="BOTIA icon" class="botia-icon">
      </div>

      <h1 id="ingredient-name">[LOADING]</h1>
      <div class="subtitle" id="subtitle">[LOADING]</div>
    </header>

    <main class="content">

      <!-- BOTIA NOTE FIRST -->
      <section class="botia-note">
        <p>
          <strong id="botia-note-title">[LOADING]</strong>
        </p>
        <p id="botia-note-text">[LOADING]</p>
      </section>

      <!-- WHY THIS ICON -->
      <section>
        <h2 id="section-why-show">[LOADING]</h2>
        <p id="why-explanation">[LOADING]</p>
      </section>

      <!-- WHAT THE LABEL SAYS -->
      <section>
        <h2 id="section-what-label">[LOADING]</h2>

        <div class="label-box">
          <p>
            <strong id="official-names">[LOADING]</strong>
            <span id="names-value">[LOADING]</span>
          </p>

          <p>
            <strong id="also-known-as">[LOADING]</strong>
            <span id="aliases-value">[LOADING]</span>
          </p>
        </div>
      </section>

      <!-- WHAT TO CHECK -->
      <section>
        <h2 id="section-what-check">[LOADING]</h2>
        <ul>
          <li id="check-1">[LOADING]</li>
          <li id="check-2">[LOADING]</li>
          <li id="check-3">[LOADING]</li>
        </ul>
      </section>

      <!-- BOTIA LIMIT -->
      <section>
        <h2 id="section-limit">[LOADING]</h2>
        <p id="limit-text">[LOADING]</p>
      </section>

      <!-- SOURCES SHORT -->
      <section>
        <h2 id="section-sources">[LOADING]</h2>
        <ul>
          <li id="source-1">[LOADING]</li>
          <li id="source-2">[LOADING]</li>
          <li id="source-3">[LOADING]</li>
        </ul>
      </section>

    </main>

    <footer>
      <p id="footer-title">[LOADING]</p>
      <p id="footer-updated">[LOADING]</p>
    </footer>

  </div>

  <script src="/botia/assets/i18n-loader.js"></script>
  <script>
    const ingredientCode = "e471-emulsifiers";
    const lang = BOTIA.detectLanguage();
    BOTIA.loadTranslations(ingredientCode, lang);
  </script>
</body>
</html>
